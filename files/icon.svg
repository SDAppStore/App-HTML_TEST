<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Adaptive Icon Drop Shadow -->
    <filter id="app-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#001020" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>

    <!-- Material Design Edge Shadows for Segments -->
    <filter id="segment-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#031A38" flood-opacity="0.35" />
    </filter>

    <!-- Center Badge Elevation Shadow -->
    <filter id="center-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#031A38" flood-opacity="0.40" />
    </filter>

    <!-- Chromium Blue Color Gradients -->
    <!-- Top Light Blue Segment -->
    <linearGradient id="chromium-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#2B6CB0" />
    </linearGradient>

    <!-- Bottom-Right Medium Blue Segment -->
    <linearGradient id="chromium-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A73E8" />
      <stop offset="100%" stop-color="#1557B0" />
    </linearGradient>

    <!-- Bottom-Left Dark Blue Segment -->
    <linearGradient id="chromium-left" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#185ABC" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>

    <!-- Center Core Gradient -->
    <linearGradient id="chromium-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1976D2" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>

    <!-- Inner Core Lighting Glow -->
    <radialGradient id="core-highlight" cx="50%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15" />
    </radialGradient>

    <!-- Android Adaptive Squircle Clip Path -->
    <clipPath id="squircle-clip">
      <path d="M 256,32 
               C 390,32 480,122 480,256 
               C 480,390 390,480 256,480 
               C 122,480 32,390 32,256 
               C 32,122 122,32 256,32 Z" />
    </clipPath>

    <!-- Donut Ring Clip Path -->
    <clipPath id="ring-clip">
      <path d="M 256,32 A 224,224 0 1,0 256,480 A 224,224 0 1,0 256,32 Z M 256,156 A 100,100 0 1,1 256,356 A 100,100 0 1,1 256,156 Z" fill-rule="evenodd" />
    </clipPath>
  </defs>

  <!-- Outer Icon Shadow & Base Shape -->
  <g filter="url(#app-shadow)">
    <!-- Squircle Background Canvas -->
    <path d="M 256,32 
             C 390,32 480,122 480,256 
             C 480,390 390,480 256,480 
             C 122,480 32,390 32,256 
             C 32,122 122,32 256,32 Z" fill="#FFFFFF" />

    <!-- Main Content Clipped to Squircle -->
    <g clip-path="url(#squircle-clip)">

      <!-- Outer Chromium Segment Ring -->
      <g clip-path="url(#ring-clip)">
        <!-- Bottom-Left Dark Blue Segment -->
        <path d="M 256,256 L 62,144 A 224,224 0 0,0 368,438 Z" fill="url(#chromium-left)" />

        <!-- Bottom-Right Medium Blue Segment with Shadow -->
        <path d="M 256,256 L 368,438 A 224,224 0 0,0 438,144 Z" fill="url(#chromium-right)" filter="url(#segment-shadow)" />

        <!-- Top Light Blue Segment with Shadow -->
        <path d="M 256,256 L 438,144 A 224,224 0 0,0 62,144 Z" fill="url(#chromium-top)" filter="url(#segment-shadow)" />
      </g>

      <!-- Center White Border Ring -->
      <circle cx="256" cy="256" r="108" fill="#FFFFFF" filter="url(#center-shadow)" />

      <!-- Inner Chromium Center Circle -->
      <circle cx="256" cy="256" r="96" fill="url(#chromium-core)" />
      
      <!-- Lighting Overlay for Depth -->
      <circle cx="256" cy="256" r="96" fill="url(#core-highlight)" />

      <!-- Text: HTML -->
      <text x="256" y="234" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="34" letter-spacing="2.5" fill="#FFFFFF" style="user-select: none;">HTML</text>

      <!-- Text: TEST -->
      <text x="256" y="278" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="25" letter-spacing="4" fill="#B3D7FF" style="user-select: none;">TEST</text>

    </g>
  </g>
</svg>
